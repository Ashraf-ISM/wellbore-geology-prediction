# =============================================================================
# LightGBM Model Configuration
# =============================================================================

model:
  name: "lightgbm_baseline"
  type: "lightgbm"
  task: "regression"

# ---------------------------------------------------------------------------
# LightGBM hyperparameters (baseline)
# ---------------------------------------------------------------------------
params:
  objective: "regression"
  metric: "rmse"
  boosting_type: "gbdt"
  n_estimators: 2000
  learning_rate: 0.05
  num_leaves: 127
  max_depth: -1
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  n_jobs: -1
  verbose: -1

# ---------------------------------------------------------------------------
# Early stopping
# ---------------------------------------------------------------------------
early_stopping:
  enabled: true
  rounds: 100
  verbose: false

# ---------------------------------------------------------------------------
# Optuna hyperparameter search space
# ---------------------------------------------------------------------------
optuna:
  n_trials: 50
  timeout: 3600        # seconds
  direction: "minimize"
  metric: "rmse"
  study_name: "lgbm_optuna"
  storage: "sqlite:///optuna.db"
  show_progress_bar: true

  search_space:
    learning_rate:
      type: "float"
      low: 0.005
      high: 0.1
      log: true
    num_leaves:
      type: "int"
      low: 31
      high: 255
    max_depth:
      type: "int"
      low: 3
      high: 12
    min_child_samples:
      type: "int"
      low: 5
      high: 100
    subsample:
      type: "float"
      low: 0.5
      high: 1.0
    colsample_bytree:
      type: "float"
      low: 0.5
      high: 1.0
    reg_alpha:
      type: "float"
      low: 1.0e-8
      high: 10.0
      log: true
    reg_lambda:
      type: "float"
      low: 1.0e-8
      high: 10.0
      log: true

# ---------------------------------------------------------------------------
# Feature importance
# ---------------------------------------------------------------------------
feature_importance:
  save: true
  top_n: 30
  plot: true
